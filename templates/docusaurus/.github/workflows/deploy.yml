# Build and deploy the Docusaurus starter to GitHub Pages.
#
# Enable this workflow by setting Settings → Pages → Source = "GitHub Actions"
# once per repository (see getting-started/deploy.md). After that, every push
# to master republishes the site at https://<owner>.github.io/<repo>/.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy at a time, and let an in-flight one finish
# so we never strand a half-published commit on Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # pnpm 11 (pinned in pnpm/action-setup above) requires Node >= 22.13
          # — it loads node:sqlite, a Node 22.5+ builtin. Node 20 crashes the
          # `pnpm store path` call in setup-node's cache step.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
