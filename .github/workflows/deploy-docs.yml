# Build the dogfood docs site (docs/) from the monorepo and publish it to the
# repo's own GitHub Pages at https://devcrocod.github.io/kotlin-docs-kit/.
#
# The homepage (docs/content/intro.mdx) doubles as the project landing page.
# Everything is built in-repo, so `workspace:*` deps resolve natively — no
# mirror repo, no subtree split, no workspace-protocol rewrite.
#
# Setup (one-time): Settings → Pages → Source: GitHub Actions.

name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "packages/docusaurus/**"
      - "packages/tokens/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: task docs:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
